name: Android APK

on:
  workflow_call:
    outputs:
      apk_available:
        description: Whether a signed Android APK artifact was produced.
        value: ${{ jobs.build.outputs.apk_available }}
    inputs:
      ref:
        type: string
        required: true
      abi:
        type: string
        required: false
        default: aarch64
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch or tag to build'
        required: false
        default: 'main'
      abi:
        description: 'Android ABI for a manual build'
        type: choice
        options:
          - aarch64
          - x86_64
        required: true
        default: aarch64

permissions:
  contents: read

concurrency:
  group: android-apk-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Android APK (${{ inputs.abi }})
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      apk_available: ${{ steps.signing.outputs.available }}
    env:
      ANDROID_ABI: ${{ inputs.abi || 'aarch64' }}
    steps:
      - name: Detect stable signing secrets
        id: signing
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $missing = @(@('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD') |
            Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          )
          if ($missing.Count -gt 0) {
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Warning ("Android APK release signing skipped; configure repository Actions secrets before publishing an APK: " + ($missing -join ', '))
          } else {
            "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Checkout requested revision
        if: steps.signing.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Setup Node.js
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: steps.signing.outputs.available == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Setup Rust
        if: steps.signing.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Android Rust and Gradle builds
        if: steps.signing.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-android-${{ hashFiles('rs/Cargo.lock', 'src-tauri/Cargo.lock', 'ui/package-lock.json', 'src-tauri/tauri.android.conf.json', 'src-tauri/app-icon.png', 'scripts/android/prepare-android-project.ps1') }}
          restore-keys: ${{ runner.os }}-android-

      - name: Install dependencies and Tauri CLI
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        run: |
          npm ci --prefix ui
          cargo install tauri-cli --locked --version 2.9.6

      - name: Build web assets
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        env:
          VITE_JEV_MOBILE: 'true'
          JEV_BUILD_REVISION: ${{ github.sha }}
        run: npm run build --prefix ui

      - name: Initialize Android project
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        run: cargo tauri android init --ci --skip-targets-install --config src-tauri/tauri.android.conf.json

      - name: Prepare Android version and launcher icons
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        run: ./scripts/android/prepare-android-project.ps1

      - name: Compile Android daemon library
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        run: |
          $abi = $env:ANDROID_ABI
          $target = if ($abi -eq 'aarch64') { 'aarch64-linux-android' } else { 'x86_64-linux-android' }
          $jniAbi = if ($abi -eq 'aarch64') { 'arm64-v8a' } else { 'x86_64' }
          $env:ANDROID_NDK_HOME = Join-Path $env:ANDROID_HOME 'ndk\27.2.12479018'
          $env:NDK_HOME = $env:ANDROID_NDK_HOME
          $env:TAURI_ANDROID_PROJECT_PATH = (Resolve-Path 'src-tauri/gen/android').Path
          $env:WRY_ANDROID_PACKAGE = 'io.github.arcj137442.jevswitch'
          $env:WRY_ANDROID_PACKAGE_UNESCAPED = $env:WRY_ANDROID_PACKAGE
          $env:WRY_ANDROID_LIBRARY = 'jev_switch_shell'
          $kotlinOut = 'src-tauri/gen/android/app/src/main/java/io/github/arcj137442/jevswitch/generated'
          New-Item -ItemType Directory -Force $kotlinOut | Out-Null
          $env:WRY_ANDROID_KOTLIN_FILES_OUT_DIR = (Resolve-Path $kotlinOut).Path
          $ndkBin = Join-Path $env:ANDROID_NDK_HOME 'toolchains\llvm\prebuilt\windows-x86_64\bin'
          $clang = Join-Path $ndkBin ("{0}24-clang.cmd" -f $target)
          if ($abi -eq 'aarch64') {
            $env:CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER = $clang
            $env:CC_aarch64_linux_android = $clang
            $env:AR_aarch64_linux_android = Join-Path $ndkBin 'llvm-ar.exe'
            $env:RANLIB_aarch64_linux_android = Join-Path $ndkBin 'llvm-ranlib.exe'
          } else {
            $env:CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER = Join-Path $ndkBin 'x86_64-linux-android24-clang.cmd'
            $env:CC_x86_64_linux_android = $env:CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER
            $env:AR_x86_64_linux_android = Join-Path $ndkBin 'llvm-ar.exe'
            $env:RANLIB_x86_64_linux_android = Join-Path $ndkBin 'llvm-ranlib.exe'
          }
          cargo build --locked --manifest-path src-tauri/Cargo.toml --package jev-switch-shell --target $target --features tauri/custom-protocol --lib --release
          if ($LASTEXITCODE -ne 0) { throw 'Android Rust library build failed.' }
          $jniDir = "src-tauri/gen/android/app/src/main/jniLibs/$jniAbi"
          New-Item -ItemType Directory -Force $jniDir | Out-Null
          Copy-Item "src-tauri/target/$target/release/libjev_switch_shell.so" "$jniDir/libjev_switch_shell.so" -Force

      - name: Package Android release APK
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        run: |
          $flavor = if ($env:ANDROID_ABI -eq 'aarch64') { 'Arm64' } else { 'X86_64' }
          Push-Location src-tauri/gen/android
          try {
            .\gradlew.bat ":app:assemble${flavor}Release" "-x" "rustBuild${flavor}Release" '-Pkotlin.incremental=false' --no-daemon
            if ($LASTEXITCODE -ne 0) { throw 'Android release APK packaging failed.' }
          } finally {
            Pop-Location
          }
          $variant = $flavor.Substring(0, 1).ToLowerInvariant() + $flavor.Substring(1) + 'Release'
          $manifestPath = "src-tauri/gen/android/app/build/intermediates/packaged_manifests/$variant/process${flavor}ReleaseManifestForPackage/AndroidManifest.xml"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { throw "Packaged Android manifest is missing: $manifestPath" }
          [xml]$manifest = Get-Content -LiteralPath $manifestPath -Raw
          $cleartext = $manifest.DocumentElement.application.GetAttribute('usesCleartextTraffic', 'http://schemas.android.com/apk/res/android')
          if ($cleartext -ne 'true') { throw "Android release APK would block its HTTP loopback gateway: usesCleartextTraffic=$cleartext" }

      - name: Prepare stable signing keystore
        if: steps.signing.outputs.available == 'true'
        id: keystore
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $keystorePath = Join-Path $env:RUNNER_TEMP 'jev-switch-release.jks'
          try {
            $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          } catch {
            throw 'ANDROID_KEYSTORE_BASE64 is not valid Base64.'
          }
          [IO.File]::WriteAllBytes($keystorePath, $bytes)
          $keystoreType = & ./scripts/android/detect-release-keystore-type.ps1 `
            -KeystorePath $keystorePath `
            -Alias $env:ANDROID_KEY_ALIAS
          Write-Host "Detected Android keystore type: $keystoreType"
          if ($keystoreType -notin @('PKCS12', 'JKS')) { throw 'Keystore type detector returned an unsupported format.' }
          "type=$keystoreType" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ANDROID_KEYSTORE_PATH=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $effectiveKeyPassword = if ($keystoreType -eq 'PKCS12') { $env:ANDROID_KEYSTORE_PASSWORD } else { $env:ANDROID_KEY_PASSWORD }
          "ANDROID_KEY_PASSWORD_EFFECTIVE=$effectiveKeyPassword" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign and verify Android APK
        if: steps.signing.outputs.available == 'true'
        id: sign
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $sdkRoot = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          if (-not $sdkRoot) { throw 'ANDROID_SDK_ROOT or ANDROID_HOME must be set.' }
          $buildTools = Join-Path $sdkRoot 'build-tools\35.0.0'
          $zipalign = Join-Path $buildTools 'zipalign.exe'
          $apksigner = Join-Path $buildTools 'apksigner.bat'
          if (-not (Test-Path $zipalign) -or -not (Test-Path $apksigner)) { throw 'Android zipalign or apksigner is missing.' }

          $version = (Get-Content ui/package.json -Raw | ConvertFrom-Json).version
          $apk = Get-ChildItem 'src-tauri/gen/android/app/build/outputs/apk' -Recurse -Filter '*release*.apk' |
            Where-Object { $_.Name -notlike '*-signed.apk' } | Select-Object -First 1
          if (-not $apk) { throw 'No Android release APK was produced.' }

          New-Item -ItemType Directory -Force artifacts | Out-Null
          $baseName = "jev-switch-$version-android-$env:ANDROID_ABI"
          $alignedApk = Join-Path $env:RUNNER_TEMP "$baseName-aligned.apk"
          $signedApk = Join-Path (Resolve-Path artifacts).Path "$baseName.apk"
          & $zipalign -p -f 4 $apk.FullName $alignedApk
          if ($LASTEXITCODE -ne 0) { throw 'zipalign failed.' }

          & $apksigner sign `
            --ks $env:ANDROID_KEYSTORE_PATH `
            --ks-pass ("pass:{0}" -f $env:ANDROID_KEYSTORE_PASSWORD) `
            --ks-key-alias $env:ANDROID_KEY_ALIAS `
            --key-pass ("pass:{0}" -f $env:ANDROID_KEY_PASSWORD_EFFECTIVE) `
            --out $signedApk `
            $alignedApk
          if ($LASTEXITCODE -ne 0) { throw 'apksigner signing failed.' }

          $verification = & $apksigner verify --verbose --print-certs $signedApk 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'apksigner verification failed.' }
          $certificateSha256 = & ./scripts/android/parse-apksigner-certificate-fingerprint.ps1 -VerificationOutput $verification
          "signer_sha256=$certificateSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "APK signer SHA-256: $certificateSha256"

      - name: Collect Android release metadata
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        env:
          SIGNER_SHA256: ${{ steps.sign.outputs.signer_sha256 }}
        run: |
          $version = (Get-Content ui/package.json -Raw | ConvertFrom-Json).version
          $properties = ConvertFrom-StringData (Get-Content src-tauri/gen/android/app/tauri.properties -Raw)
          $apkName = "jev-switch-$version-android-$env:ANDROID_ABI.apk"
          $manifestPath = "artifacts/jev-switch-$version-android-$env:ANDROID_ABI.json"
          $manifest = [ordered]@{
            product = 'jev-switch'
            version = $version
            version_code = [int]$properties['tauri.android.versionCode']
            commit = (git rev-parse HEAD)
            abi = $env:ANDROID_ABI
            signing = 'stable Android release keystore'
            signer_sha256 = $env:SIGNER_SHA256
            icon_source_sha256 = (Get-FileHash src-tauri/app-icon.png -Algorithm SHA256).Hash
            apk = $apkName
            sha256 = (Get-FileHash "artifacts/$apkName" -Algorithm SHA256).Hash
            built_at = (Get-Date).ToUniversalTime().ToString('o')
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath $manifestPath -Encoding utf8
          Get-Content -LiteralPath $manifestPath

      - name: Upload signed Android APK artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jev-switch-android-${{ inputs.abi }}
          path: artifacts/*
          if-no-files-found: error

      - name: Report missing signing configuration
        if: steps.signing.outputs.available != 'true'
        shell: pwsh
        run: Write-Host 'Android job completed without an APK; Windows/CLI/Docker release assets remain publishable.'
