name: Release

# 发版流水线（任务 #45 · docs/12 §四-线3「GitHub Release 便携分发」）
#
# 触发：
#   - push tag `v*`     → 全量发版（测试门禁 → Windows 桌面 + ghcr 镜像 → GitHub Release）
#   - workflow_dispatch → 干跑：构建产物但**不推 ghcr、不建 Release**（验流水线本身）
#
# 测试门禁不在本文件重复实现 —— 以 `workflow_call` 复用 ci.yml。
# Windows 上 `cargo test` 与 `cargo build` 同 target-dir 会撞文件锁
# （实测 error: failed to remove file jev-switch.exe / os error 5），
# 故后端测试留在 ubuntu 的 ci.yml；Windows 顺序运行壳测试与构建，rs/ 与 src-tauri/
# 是两个互不相干的 Cargo 工程（各自 target 目录）→ 结构上不会撞锁。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '干跑校验用的版本号（不带 v）；留空则取 ui/package.json'
        required: false
        default: ''

# 最小权限：默认只读，发 Release / 推 ghcr 的 job 各自就地提权
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  JEV_BUILD_REVISION: ${{ github.sha }}
  # sidecar 落地时剥 target-triple；**不可**与壳主二进制 jev-switch.exe 同名
  # （WiX ICE30 两组件同装一文件名 → MSI 失败），见 docs/deployment.md §9.4-2
  SIDECAR_TRIPLE: x86_64-pc-windows-msvc

jobs:
  # ── 1. 版本一致性门禁（防忘记 bump 五处版本号） ──────────────────
  meta:
    name: 版本门禁
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析并校验版本号
        id: v
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH=true
          else
            VERSION="$REQUESTED_VERSION"
            PUBLISH=false
          fi

          UI_VER=$(node -p "require('./ui/package.json').version")
          TAURI_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ANDROID_VER=$(node -p "require('./src-tauri/tauri.android.conf.json').version")
          RS_VER=$(grep -m1 '^version' rs/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          SHELL_VER=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')

          # 干跑未给版本 → 取 ui/package.json，并校验所有桌面/Android 版本字段
          if [ -z "$VERSION" ]; then VERSION="$UI_VER"; fi

          echo "tag/input : $VERSION"
          echo "ui        : $UI_VER"
          echo "tauri.conf: $TAURI_VER"
          echo "tauri.android.conf: $ANDROID_VER"
          echo "rs/Cargo  : $RS_VER"
          echo "shell/Cargo: $SHELL_VER"

          fail=0
          for pair in "ui:$UI_VER" "tauri.conf:$TAURI_VER" "tauri.android.conf:$ANDROID_VER" "rs/Cargo:$RS_VER" "shell/Cargo:$SHELL_VER"; do
            name="${pair%%:*}"; got="${pair#*:}"
            if [ "$got" != "$VERSION" ]; then
              echo "::error::$name 版本 $got ≠ 期望 $VERSION — 五处版本号必须同步（见 docs/RELEASE.md）"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1

          # Release narrative gate: every version must explain purpose, user path,
          # comparison and boundaries in the matching changelog section.
          CHANGELOG="CHANGELOG.md"
          for marker in "## [$VERSION]" "用户叙事与对照场景" "起点" "问题" "操作" "结果" "对照" "边界"; do
            if ! grep -Fq "$marker" "$CHANGELOG"; then
              echo "::error::CHANGELOG.md 缺少 v$VERSION 发布叙事字段：$marker — 请补齐功能目的、用户路径、对照场景与边界（见 docs/RELEASE.md）"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  # ── 2. 测试门禁（复用 ci.yml，不重复实现） ─────────────────────────
  gate:
    name: 测试门禁
    needs: meta
    uses: ./.github/workflows/ci.yml

  # ── 3. Windows 桌面（Tauri 2 · MSI + NSIS + 便携版） ──────────────
  windows:
    name: Windows 桌面
    needs: [meta, gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust 缓存（rs/ + src-tauri/ 两工程分键）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rs/target
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('rs/Cargo.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: npm ci
        run: npm ci --prefix ui

      # daemon 先构建 → 作为 sidecar 塞进 src-tauri/binaries/
      # （binaries/ 已 gitignore，fresh clone 必须这步，见 docs/deployment.md §9.2）
      # 命名必须带 target-triple（externalBin 约定），且**不可**与壳 bin 同名
      # （WiX ICE30 → MSI 失败，见 docs/deployment.md §9.4-2）
      - name: 构建 daemon（sidecar）
        run: cargo build --release --locked --manifest-path rs/Cargo.toml -p jev-switch-daemon

      - name: 放置 sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item rs/target/release/jev-switch.exe `
            "src-tauri/binaries/jev-switch-daemon-${{ env.SIDECAR_TRIPLE }}.exe" -Force
          Get-ChildItem src-tauri/binaries

      # cargo test 编译 Tauri build script，它要求 ui/dist 已存在；fresh runner 不会继承 gate job 的产物。
      - name: 构建桌面测试所需 UI 资源
        run: npm run build --prefix ui

      - name: 桌面内核身份与产物解析回归
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # 必须在 src-tauri/ 下跑：beforeBuildCommand 的 hook cwd = src-tauri 的父目录
      # （= 仓库根），故 `npm run build --prefix ui` 才解析正确（docs/deployment.md §9.4-1）
      - name: Tauri build（nsis + msi）
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2.11.5 build

      - name: 组装同批便携运行目录并压缩
        shell: pwsh
        run: |
          $version = '${{ needs.meta.outputs.version }}'
          $msiPattern = '*_{0}_*.msi' -f $version
          $nsisPattern = '*_{0}_*-setup.exe' -f $version
          $msi = @(Get-ChildItem src-tauri/target/release/bundle/msi -Filter $msiPattern -File)
          $nsis = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter $nsisPattern -File)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) {
            throw "Expected one MSI and one NSIS artifact; found MSI=$($msi.Count), NSIS=$($nsis.Count)."
          }
          # The Cargo target cache also contains bundle outputs. Give each run/attempt
          # a fresh portable directory so a restored cache cannot trip the packager's
          # deliberate no-overwrite guard.
          $portable = "src-tauri/target/release/bundle/portable/jev-switch-${{ needs.meta.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}"
          .\scripts\package-portable.ps1 -Destination $portable -MsiPath $msi[0].FullName -NsisPath $nsis[0].FullName
          # Keep the user-facing archive name stable and write it outside the cached target tree.
          $zip = "jev-switch-portable-${{ needs.meta.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path (Join-Path $portable '*') -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash -LiteralPath $zip -Algorithm SHA256

          # Build a separate one-file Tauri application from the same verified daemon/UI inputs.
          $standalone = "src-tauri/target/release/bundle/standalone/jev-switch-standalone-${{ needs.meta.outputs.version }}-windows-x64.exe"
          .\scripts\build-standalone.ps1 -PortableDirectory $portable -OutputPath $standalone
          Get-FileHash -LiteralPath $standalone -Algorithm SHA256

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: jev-switch-windows-${{ needs.meta.outputs.version }}
          path: |
            src-tauri/target/release/bundle/msi/jev-switch_${{ needs.meta.outputs.version }}_x64_en-US.msi
            src-tauri/target/release/bundle/nsis/jev-switch_${{ needs.meta.outputs.version }}_x64-setup.exe
            jev-switch-portable-*-windows-x64.zip
            src-tauri/target/release/bundle/standalone/jev-switch-standalone-*-windows-x64.exe
          if-no-files-found: error

  # ── 4. Headless CLI（Linux/Windows；Termux 使用设备本机 cargo install） ──
  cli:
    name: CLI (${{ matrix.platform }})
    needs: [meta, gate]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            executable: rs/target/release/jev-switch-cli
          - os: windows-latest
            platform: windows-x64
            executable: rs/target/release/jev-switch-cli.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 构建 CLI
        run: cargo build --release --locked --manifest-path rs/Cargo.toml -p jev-switch-cli
      - name: 准备 CLI 产物
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.executable }}" "dist/jev-switch-cli-${{ needs.meta.outputs.version }}-${{ matrix.platform }}${{ matrix.platform == 'windows-x64' && '.exe' || '' }}"
      - name: 上传 CLI
        uses: actions/upload-artifact@v4
        with:
          name: jev-switch-cli-${{ needs.meta.outputs.version }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Android APK
    needs: [meta, gate]
    if: needs.meta.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ github.ref_name }}
      abi: aarch64
    secrets: inherit

  # ── 5. Docker 镜像（ghcr.io） ─────────────────────────────────────
  docker:
    name: Docker 镜像
    needs: [meta, gate]
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ steps.img.outputs.repo }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 干跑不推镜像 —— 只验 Dockerfile 能构建
      - name: 登录 ghcr.io
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像名转小写（ghcr 要求）
        id: img
        shell: bash
        run: printf 'repo=%s\n' "$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: JEV_BUILD_REVISION=${{ github.sha }}
          push: ${{ needs.meta.outputs.publish == 'true' }}
          tags: |
            ghcr.io/${{ steps.img.outputs.repo }}:${{ needs.meta.outputs.version }}
            ghcr.io/${{ steps.img.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 6. GitHub Release（仅 tag 触发） ──────────────────────────────
  release:
    name: GitHub Release
    needs: [meta, windows, docker, cli, android]
    if: always() && needs.meta.outputs.publish == 'true' && needs.windows.result == 'success' && needs.docker.result == 'success' && needs.cli.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jev-switch-windows-${{ needs.meta.outputs.version }}
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: jev-switch-cli-${{ needs.meta.outputs.version }}-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        if: needs.android.outputs.apk_available == 'true'
        with:
          name: jev-switch-android-aarch64
          path: dist

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.meta.outputs.version }}
          generate_release_notes: true
          overwrite_files: true
          files: dist/**/*
          body: |
            ## 版本说明

            本次为 `${{ needs.meta.outputs.version }}` 版本。Android APK 继续使用同一稳定签名；请核对随包 JSON 中的 commit、版本码与 APK SHA-256。

            ## 本版内容

            - 同一 `POST /v1/systemone` 请求可携带显式 `extensions` 或兼容服务所需的未知顶层字段。
            - local 模式默认保留扩展；TypeSafe-compatible provider 可显式开启 `forward_extensions`，官方 TypeSafe 默认剥离并在响应元数据中记录处理状态。
            - v0.8.0 的 Graph API、Dashboard 布局、provider attempt 双视图、Android 原生 JSON/剪贴板桥和既有路由能力继续保留。

            ## 用户叙事与对照场景

            ### 顶级页面快捷切换：像浏览器标签一样比较页面

            用户在 Jev Switch 中反复比较 Dashboard、Providers、Routing 和 Playground，需要连续查看多个顶级页面。鼠标往返顶栏会打断对照节奏，而普通浏览器的 Ctrl+Tab 又不应被网页版本抢走。现在 Tauri APP 中按 Ctrl+Tab 顺序切换、Ctrl+Shift+Tab 逆序切换；焦点位于输入控件或可编辑区域时快捷键让位。对照场景是：Tauri APP 接管页面循环，普通浏览器保留浏览器标签切换；只读用户只循环访问可见页面。

            ### 多模态与滚轮交互的连续体验

            v0.9.x 还让本地多模态 provider 通过同一个 `/v1/systemone` 入口承载媒体扩展，并让 Routing DAG 普通滚轮上下平移、Shift+滚轮左右平移。媒体转发与视觉质量、滚轮手感与硬件设备分别验证，避免把协议兼容或输入便利误写成模型质量承诺。

            ## 用户叙事与对照场景

            ### 多模态兼容：同一个 Jev 入口承载图片决策

            用户已经有本地 OneJev 图片决策服务，但下游只会调用 `/v1/systemone`。问题在于官方 TypeSafe 是文本/JSON 边界，把 Base64 塞进 `state` 无法表达媒体语义。用户把媒体放入 `extensions.media` 并为本地兼容 provider 开启 `forward_extensions`，Jev Switch 继续提供同一个入口，同时在 route trace 中记录字段名和 forwarded/stripped 状态。与官方 TypeSafe 对照时，协议不变但媒体被明确剥离；视觉质量与概率校准仍单独验收。

            ### Routing DAG 滚轮平移：从拖拽浏览到滚轮浏览

            当路由图变成长地图，用户原本只能拖拽空白区域移动视口。现在普通滚轮上下平移，Shift+滚轮左右平移，触控板 `deltaX` 优先；Ctrl/⌘+滚轮仍缩放，拖拽节点仍改布局。对照可见滚轮改变“看哪里”、缩放改变“看多大”、拖拽改变“图怎么组织”；输入控件与触摸路径保留原行为。原生硬件手感和多模态模型质量仍需相应设备/模型验证。

            ## 安装

            **Windows 桌面**：下载下方 `.msi`（或 NSIS `.exe`）双击安装。
            **Windows 便携版**：下载 `.zip` 并解压，双击其中的 `jev-switch.exe`；它与同次构建的安装包共享壳、daemon 与 UI 资源，不运行安装器。
            **Windows 独立版**：下载 `jev-switch-standalone-*-windows-x64.exe` 并双击；首次启动会把内嵌 daemon/UI 校验后释放到当前用户的版本化运行缓存，应用数据仍保存在 `%APPDATA%\\jev-switch`。
            **Headless CLI**：下载对应平台的 `jev-switch-cli-*`；Termux/Android arm64 请在设备上执行 `cargo install --path rs/crates/jev-switch-cli --locked`，避免把主机二进制误当成 Android 包。
            **Android**：仓库配置四个稳定签名 Secrets 后，Release 会附带 `jev-switch-<version>-android-aarch64.apk` 与 manifest；未配置时 Android job 会明确跳过，但 Windows/CLI/Docker 仍会正常发布。首次从历史 debug-signed APK 升级到稳定签名包时，需先卸载旧版本一次。

            **Docker（Bash）**：先将 `JEV_ADMIN_PASSWORD` 设置为自己的管理员密码。
            下例挂载持久数据卷，并只在宿主机回环地址提供控制台。

            ```bash
            : "${JEV_ADMIN_PASSWORD:?请先设置管理员密码}"
            export JEV_ADMIN_PASSWORD
            docker pull ${{ needs.docker.outputs.image }}:${{ needs.meta.outputs.version }}
            docker run -d --name jev-switch \
              -p 127.0.0.1:11435:11435 \
              --restart unless-stopped --stop-timeout 15 \
              -e JEV_SWITCH_MODE=cloud -e JEV_BIND=0.0.0.0:11435 \
              -e JEV_ADMIN_PASSWORD -v jev-switch-data:/data \
              ${{ needs.docker.outputs.image }}:${{ needs.meta.outputs.version }}
            ```

            打开 `http://127.0.0.1:11435`，用管理员密码登录，再到 Token 管理创建调用 Token。
            远程部署、反向代理和配置导入见 `docs/deployment.md`。
            发版流程与排查见 `docs/RELEASE.md`。

      # A release created with GITHUB_TOKEN does not emit a follow-up release
      # workflow run. workflow_dispatch is the supported non-recursive exception.
      - name: Refresh GitHub Pages release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
