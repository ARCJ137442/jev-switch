name: Experimental Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch or tag to build'
        required: false
        default: 'main'
      abi:
        description: 'Android ABI (aarch64 or x86_64)'
        required: false
        default: 'aarch64'

permissions:
  contents: read

concurrency:
  group: android-experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Experimental Android APK (${{ inputs.abi }})
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: pwsh
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install dependencies and Tauri CLI
        shell: pwsh
        run: |
          npm ci --prefix ui
          cargo install tauri-cli --locked

      - name: Build web assets
        shell: pwsh
        env:
          VITE_JEV_MOBILE: 'true'
          JEV_BUILD_REVISION: ${{ github.sha }}
        run: npm run build --prefix ui

      - name: Initialize Android project
        shell: pwsh
        run: |
          cargo tauri android init --ci --skip-targets-install --config src-tauri/tauri.android.conf.json

      - name: Compile Android daemon library
        shell: pwsh
        run: |
          $abi = '${{ inputs.abi }}'
          $target = if ($abi -eq 'aarch64') { 'aarch64-linux-android' } else { 'x86_64-linux-android' }
          $jniAbi = if ($abi -eq 'aarch64') { 'arm64-v8a' } else { 'x86_64' }
          $env:ANDROID_NDK_HOME = Join-Path $env:ANDROID_HOME 'ndk\27.2.12479018'
          $env:NDK_HOME = $env:ANDROID_NDK_HOME
          $env:TAURI_ANDROID_PROJECT_PATH = (Resolve-Path 'src-tauri/gen/android').Path
          $env:WRY_ANDROID_PACKAGE = 'io.github.arcj137442.jevswitch'
          $env:WRY_ANDROID_PACKAGE_UNESCAPED = $env:WRY_ANDROID_PACKAGE
          $env:WRY_ANDROID_LIBRARY = 'jev_switch_shell'
          $kotlinOut = 'src-tauri/gen/android/app/src/main/java/io/github/arcj137442/jevswitch/generated'
          New-Item -ItemType Directory -Force $kotlinOut | Out-Null
          $env:WRY_ANDROID_KOTLIN_FILES_OUT_DIR = (Resolve-Path $kotlinOut).Path
          $ndkBin = Join-Path $env:ANDROID_NDK_HOME 'toolchains\llvm\prebuilt\windows-x86_64\bin'
          $clang = Join-Path $ndkBin ("{0}24-clang.cmd" -f $target)
          if ($abi -eq 'aarch64') {
            $env:CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER = $clang
            $env:CC_aarch64_linux_android = $clang
            $env:AR_aarch64_linux_android = Join-Path $ndkBin 'llvm-ar.exe'
            $env:RANLIB_aarch64_linux_android = Join-Path $ndkBin 'llvm-ranlib.exe'
          } else {
            $env:CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER = Join-Path $ndkBin 'x86_64-linux-android24-clang.cmd'
            $env:CC_x86_64_linux_android = $env:CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER
            $env:AR_x86_64_linux_android = Join-Path $ndkBin 'llvm-ar.exe'
            $env:RANLIB_x86_64_linux_android = Join-Path $ndkBin 'llvm-ranlib.exe'
          }
          cargo build --locked --manifest-path src-tauri/Cargo.toml --package jev-switch-shell --target $target --features tauri/custom-protocol --lib --release
          if ($LASTEXITCODE -ne 0) { throw 'Android Rust library build failed.' }
          if (-not (Test-Path 'src-tauri/gen/android/tauri.settings.gradle')) { throw 'Tauri Android build script did not generate tauri.settings.gradle.' }
          $jniDir = "src-tauri/gen/android/app/src/main/jniLibs/$jniAbi"
          New-Item -ItemType Directory -Force $jniDir | Out-Null
          Copy-Item "src-tauri/target/$target/release/libjev_switch_shell.so" "$jniDir/libjev_switch_shell.so" -Force

      - name: Package experimental APK
        shell: pwsh
        run: |
          $abi = '${{ inputs.abi }}'
          $flavor = if ($abi -eq 'aarch64') { 'Arm64' } else { 'X86_64' }
          Push-Location src-tauri/gen/android
          try {
            .\gradlew.bat ":app:assemble${flavor}Release" "-x" "rustBuild${flavor}Release" '-Pkotlin.incremental=false' --no-daemon
            if ($LASTEXITCODE -ne 0) { throw 'Android APK packaging failed.' }
          } finally {
            Pop-Location
          }

      - name: Collect APK metadata
        shell: pwsh
        run: |
          $version = (Get-Content ui/package.json | ConvertFrom-Json).version
          $commit = git rev-parse HEAD
          $apk = Get-ChildItem -Path src-tauri/gen/android/app/build/outputs/apk -Recurse -Filter "app-*-release-unsigned.apk" | Select-Object -First 1
          if (-not $apk) { throw 'No APK produced.' }
          $hash = (Get-FileHash -LiteralPath $apk.FullName -Algorithm SHA256).Hash
          $meta = [ordered]@{ product = 'jev-switch'; version = $version; commit = $commit; abi = '${{ inputs.abi }}'; experimental = $true; apk = $apk.Name; sha256 = $hash; built_at = (Get-Date).ToUniversalTime().ToString('o') }
          $meta | ConvertTo-Json | Set-Content -Encoding UTF8 .tmp-android-manifest.json
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $apk.FullName "artifacts/jev-switch-$version-android-${{ inputs.abi }}-experimental.apk"
          Copy-Item .tmp-android-manifest.json artifacts/jev-switch-$version-android-${{ inputs.abi }}-experimental.json

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: jev-switch-android-${{ inputs.abi }}-experimental
          path: artifacts/*
          if-no-files-found: error
