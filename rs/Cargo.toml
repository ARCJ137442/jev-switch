# Jev-Switch cargo workspace（P0-1 拆分：纯搬家，语义不变）
#
# 结构：
#   crates/jev-protocol       — 协议类型（零 IO，仅 serde/serde_json）
#   crates/jev-core           — router + Upstream trait + translate（无 axum / reqwest）
#   crates/jev-adapters       — vercel / laya 上游适配（reqwest + async-trait）
#   crates/jev-switch-daemon  — axum daemon（bin：main + config）
#
# 常用命令（从仓库根执行）：
#   cargo test --manifest-path rs/Cargo.toml --workspace
#   cargo run   --manifest-path rs/Cargo.toml        # default-members 指向 daemon

[workspace]
resolver = "2"
members = ["crates/*"]
# 裸 `cargo run/build`（virtual manifest）默认只构建 daemon bin
default-members = ["crates/jev-switch-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ARCJ137442/jev-switch"

[workspace.dependencies]
# 内部 crate
jev-protocol = { path = "crates/jev-protocol", version = "0.1.0" }
jev-core = { path = "crates/jev-core", version = "0.1.0" }
jev-adapters = { path = "crates/jev-adapters", version = "0.1.0" }

# 外部 crate（版本与拆分前 rs 单包保持一致）
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
tower-http = { version = "0.6", features = ["cors", "fs"] } # fs：#43 容器同源托管 ui/dist（ServeDir）
# A6：P1-3 wiremock 验收（workspace 级）；A8 起 daemon 集成基座同源复用
wiremock = "0.6"
