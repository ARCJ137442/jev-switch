# Jev-Switch MVP example config
#
# 加载顺序：
#   1. $JEV_SWITCH_CONFIG 环境变量
#   2. 否则 ~/.jev-switch/providers.toml
#
# 相对路径基准：按启动进程时的 CWD 解析（工作区约定 = 仓库根，如
# `JEV_SWITCH_CONFIG="rs\providers.example.toml"`），不是本文件/manifest 所在目录。
# cargo workspace 拆分（rs/Cargo.toml → crates/*）不改变该基准。
#
# 密钥（Q4=b 默认档 · contracts/04 §1 · A7）：
#   - 明文 `api_key = "sk-…"`（**优先读取**；示例不写真实 key，仅注释示意）
#   - `api_key_env = "…"`（环境变量名，**兼容保留**；明文缺省时回退到此）
#   - 真值文件应 0600、~/.jev-switch/ 目录 0700（Windows 降级为启动/写回告警）
#   - UI/API 只出 `api_key_masked`（如 sk-****a1b2），永无读回明文接口
#   - admin PUT 写回会保留本文件其它段，但**注释不保留**（toml 往返限制）
#
# MVP 范围（M0）：2 provider + 模型路由 DAG（[[routes]]）+ 旧 [router] 兼容表。
#
# ── 双态开关（#43 · docs/12 §一）────────────────────────────────────
# mode 只管鉴权，**不涉及上游拓扑**（拓扑不区分：以内核所在位置访问上游）。
#   mode = "local"   # 默认：绑 127.0.0.1:11435，完全不校验 token/密码（现状）
#   mode = "cloud"   # 绑 0.0.0.0:11435，/v1 要 Bearer 调用 token，admin 要会话
# env 覆盖：JEV_SWITCH_MODE=local|cloud（非法值拒绝启动）。
#
# cloud 态鉴权（可选；local 态忽略这两项）：
#   auth_tokens = ["tok-…"]        # /v1 调用 token（也可写 [[auth_tokens]] token="…"
#                                  #   或 env JEV_AUTH_TOKENS=逗号分隔，env 优先）
#   admin_password = "…"           # admin 登录密码（明文 toml —— Q4=b 哲学，0600 文件；
#                                  #   env JEV_ADMIN_PASSWORD 优先；UI 只见会话，永不见密码）
# 部署细节与风险块：docs/deployment.md。

[providers.vercel]
kind = "vercel"
base = "https://ai-gateway.vercel.sh/v4/ai/evaluation-model"
# 明文 key（优先）示意：api_key = "sk-…"   ← 不写真实值；或改用下方 env
api_key_env = "AI_GATEWAY_API_KEY"
enabled = true

[providers.laya]
kind = "laya"
base = "http://127.0.0.1:18765/v1/systemone"
enabled = true

# ── Router 段（旧式，兼容保留）：model id → upstream id ──────────────
# 每条 = 单条 match=exact 边（priority=0、on_error=next、sticky=none）。
# 调用方 POST {"model": "laya-english", ...} 即走 Laya
# 调用方 POST {"model": "typesafe-ai/jev", ...} 即走 Vercel
# —— 这两条映射的语义不因下方 [[routes]] 示例而改变（不同 left，互不冲突）。
[router]
"laya-english" = "laya"
"typesafe-ai/jev" = "vercel"
# 同一 Laya 提供商（同一地址 18765）下的更多模型 —— 一个 API 地址 = 一个提供商，
# 多 checkpoint = 同提供商不同模型（LM Studio 同款标准；见 docs/11-提供商与模型接口路由.md）。
# 服务端 scripts/laya_multi_server.py 按 model id 分派 english / multilingual / router。
"laya-multilingual" = "laya"
"laya-router" = "laya"

# ── 模型路由 DAG（contracts/03 §2 [[routes]]）────────────────────────
# 示例一：对外 id "jev" 双候选（同模型可切换）——
#   p10 优先走 Vercel（改写上游 model 为 typesafe-ai/jev）；
#   Vercel 429/5xx/超时/网络类可重试错误自动 failover 到 p30 的 Laya
#   （on_error=next；Laya 侧改写上游 model 为 laya-english）。
[[routes]]
left = "jev"
match = "exact"
right = "vercel"
upstream_model = "typesafe-ai/jev"
priority = 10
sticky = "session"
on_error = "next"

[[routes]]
left = "jev"
match = "exact"
right = "laya"
upstream_model = "laya-english"
priority = 30
on_error = "next"

# 示例二：前缀族 —— 调用方 POST {"model": "local/qwen", ...} 命中 Laya
# （match=prefix：left 去掉尾部 * 后作前缀比较；无 upstream_model = 沿用原 model）。
[[routes]]
left = "local/*"
match = "prefix"
right = "laya"
priority = 40
on_error = "next"

# 示例三：公共 id 落到「提供商内的模型接口」——
# "jev-zh" 经 upstream_model 改写为 Laya 提供商的多语言模型接口 laya-multilingual
# （路由终点 = (提供商, 模型) 二元组，不是裸提供商；见 docs/11-提供商与模型接口路由.md）。
[[routes]]
left = "jev-zh"
match = "exact"
right = "laya"
upstream_model = "laya-multilingual"
priority = 20
on_error = "next"
