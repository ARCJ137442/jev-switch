# Jev-Switch MVP example config
#
# 加载顺序：
#   1. $JEV_SWITCH_CONFIG 环境变量
#   2. 否则 ~/.jev-switch/providers.toml
#
# 相对路径基准：按启动进程时的 CWD 解析（工作区约定 = 仓库根，如
# `JEV_SWITCH_CONFIG="rs\providers.example.toml"`），不是本文件/manifest 所在目录。
# cargo workspace 拆分（rs/Cargo.toml → crates/*）不改变该基准。
#
# MVP 范围（M0）：2 provider + 静态 model→upstream 映射。

[providers.vercel]
kind = "vercel"
base = "https://ai-gateway.vercel.sh/v4/ai/evaluation-model"
api_key_env = "AI_GATEWAY_API_KEY"
enabled = true

[providers.laya]
kind = "laya"
base = "http://127.0.0.1:18765/v1/systemone"
enabled = true

# Router 段：model id → upstream id
# 调用方 POST {"model": "laya-english", ...} 即走 Laya
# 调用方 POST {"model": "typesafe-ai/jev", ...} 即走 Vercel
[router]
"laya-english" = "laya"
"typesafe-ai/jev" = "vercel"
