[package]
name = "jev-switch-daemon"
description = "Jev-Switch daemon：axum HTTP 入口 + 配置装配"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "jev-switch"
path = "src/main.rs"

[features]
default = []
# ts-rs 类型导出（生成物 → ui/src/generated/）：转发协议 crate 同名 feature
ts-rs = ["dep:ts-rs", "jev-protocol/ts-rs"]

[dependencies]
jev-protocol = { workspace = true }
jev-core = { workspace = true }
jev-adapters = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { workspace = true }
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
async-trait = { workspace = true }
